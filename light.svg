    <rect class="accent-bar d5" x="196" y="540.5" width="44" height="3.5" rx="1.75" fill="#2563eb" />
    <rect class="accent-bar d4" x="340" y="540.5" width="44" height="3.5" rx="1.75" fill="#0284c7" />
    <rect class="accent-bar d3" x="484" y="540.5" width="44" height="3.5" rx="1.75" fill="#2563eb" />
    <rect class="accent-bar d2" x="628" y="540.5" width="44" height="3.5" rx="1.75" fill="#0284c7" />
    <rect class="accent-bar d1" x="772" y="540.5" width="44" height="3.5" rx="1.75" fill="#2563eb" />
