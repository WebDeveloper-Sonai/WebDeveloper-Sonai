<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="Animated Profile Card - Light">
  <defs>
    
    <pattern id="dots-blue" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.7" fill="#60a5fa" />
    </pattern>
    <pattern id="dots-blue-dim" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.25" fill="#3b82f6" opacity="0.72" />
    </pattern>
    <pattern id="dots-bright" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.9" fill="#dbeafe" />
    </pattern>
    <pattern id="dots-shadow" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.1" fill="#1e3a8a" opacity="0.85" />
    </pattern>
    <pattern id="dots-bg" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="0.8" fill="#1b2b44" opacity="0.55" />
    </pattern>

    <clipPath id="screen-clip">
      <rect x="44" y="80" width="350" height="372" rx="8" />
    </clipPath>
    <clipPath id="lens-left-clip">
      <rect x="176" y="232" width="46" height="34" rx="10" />
    </clipPath>
    <clipPath id="lens-right-clip">
      <rect x="234" y="234" width="44" height="33" rx="10" />
    </clipPath>

    <linearGradient id="lens-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="55%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <linearGradient id="scan-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="85%" stop-color="#10b981" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="top-bar-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <filter id="glow-sun" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

    .dash-outer { animation: dashMove 4s linear infinite; }
    .dash-panel { animation: dashMoveRev 3.2s linear infinite; }
    @keyframes dashMove { to { stroke-dashoffset: -32; } }
    @keyframes dashMoveRev { to { stroke-dashoffset: 28; } }

    .accent-bar { animation: barPulse 2.6s ease-in-out infinite; }
    @keyframes barPulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

    .tl-dot { animation: tlBreath 3s ease-in-out infinite; }
    @keyframes tlBreath { 0%, 100% { opacity: 0.78; } 50% { opacity: 1; } }

    .tool-icon { animation: toolFloat 3.6s ease-in-out infinite; }
    @keyframes toolFloat { 0%, 100% { opacity: 0.65; } 50% { opacity: 1; } }

    .portrait-shimmer { animation: shimmer 4.5s ease-in-out infinite; }
    @keyframes shimmer { 0%, 100% { opacity: 0.88; } 50% { opacity: 1; } }

    .scanline { animation: scanDown 4.2s linear infinite; }
    @keyframes scanDown {
      0% { transform: translateY(-60px); }
      100% { transform: translateY(390px); }
    }

    .sun-glint {
      transform-box: fill-box;
      transform-origin: center;
      animation: sunPulse 2.6s ease-in-out infinite;
    }
    @keyframes sunPulse {
      0%, 100% { transform: scale(0.9); opacity: 0.75; }
      50% { transform: scale(1.35); opacity: 1; }
    }
    .lens-sheen { animation: sheenSlide 3.8s ease-in-out infinite; }
    @keyframes sheenSlide {
      0%, 100% { transform: translateX(-18px); opacity: 0.15; }
      50% { transform: translateX(26px); opacity: 0.45; }
    }

    .hatband-pulse { animation: barPulse 2.4s ease-in-out infinite; }
    .collar-btn {
      transform-box: fill-box;
      transform-origin: center;
      animation: btnPulse 2.2s ease-in-out infinite;
    }
    @keyframes btnPulse {
      0%, 100% { transform: scale(1); opacity: 0.78; }
      50% { transform: scale(1.25); opacity: 1; }
    }

    .status-core { animation: statusGlow 2s ease-in-out infinite; }
    @keyframes statusGlow { 0%, 100% { opacity: 0.8; } 50% { opacity: 1; } }
    .status-ring {
      transform-box: fill-box;
      transform-origin: center;
      animation: radarPing 2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    @keyframes radarPing {
      0% { transform: scale(1); opacity: 0.85; }
      100% { transform: scale(3.2); opacity: 0; }
    }

    .cursor-blink { animation: blink 1s steps(1, end) infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

    .pill {
      transform-box: fill-box;
      transform-origin: center;
      animation: pillWave 3.2s ease-in-out infinite;
    }
    @keyframes pillWave {
      0%, 100% { opacity: 0.85; transform: translateY(0px); }
      50% { opacity: 1; transform: translateY(-2.5px); }
    }
    .social-icon {
      transform-box: fill-box;
      transform-origin: center;
      animation: iconPulse 3s ease-in-out infinite;
    }
    @keyframes iconPulse {
      0%, 100% { opacity: 0.75; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.12); }
    }

    .fade-line { animation: textBreath 5s ease-in-out infinite; }
    @keyframes textBreath { 0%, 100% { opacity: 0.85; } 50% { opacity: 1; } }

    .d1 { animation-delay: 0.15s; }
    .d2 { animation-delay: 0.35s; }
    .d3 { animation-delay: 0.55s; }
    .d4 { animation-delay: 0.75s; }
    .d5 { animation-delay: 0.95s; }
    .d6 { animation-delay: 1.15s; }
    .d7 { animation-delay: 1.35s; }
  </style>

  
  <rect x="6" y="6" width="888" height="548" rx="18" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5" />
  <rect class="dash-outer" x="18" y="18" width="864" height="524" rx="12" fill="none" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="6 10" />

  
  <g>
    <rect class="accent-bar d1" x="155" y="16" width="46" height="3.5" rx="1.75" fill="#2563eb" />
    <rect class="accent-bar d2" x="306" y="16" width="46" height="3.5" rx="1.75" fill="#0284c7" />
    <rect class="accent-bar d3" x="456" y="16" width="46" height="3.5" rx="1.75" fill="#2563eb" />
