          <polyline class="lens-chart" points="175,253 185,244 193,249 206,238" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-cyan)" />

          
          <rect class="lens-glow" x="226" y="232" width="42" height="30" rx="7" fill="#072227" stroke="#f6d365" stroke-width="2.4" />
