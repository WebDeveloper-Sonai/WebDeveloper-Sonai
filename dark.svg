<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="Animated Profile Card - Dark">
  <defs>
    
    <pattern id="dots-gold" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.7" fill="#e5c063" />
    </pattern>
    <pattern id="dots-gold-dim" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.25" fill="#b8943e" opacity="0.75" />
    </pattern>
    <pattern id="dots-bright" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.95" fill="#fff0b8" />
    </pattern>
    <pattern id="dots-bg" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="0.8" fill="#1b2b44" opacity="0.55" />
    </pattern>

    
    <clipPath id="screen-clip">
      <rect x="44" y="80" width="350" height="372" rx="8" />
    </clipPath>
    <linearGradient id="scan-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="85%" stop-color="#e5c063" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#e5c063" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="top-bar-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e5c063" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#e5c063" />
    </linearGradient>

    
    <filter id="glow-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-cyan" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

    /* Marching dashed borders */
    .dash-outer { animation: dashMove 4s linear infinite; }
    .dash-panel { animation: dashMoveRev 3.2s linear infinite; }
    @keyframes dashMove { to { stroke-dashoffset: -32; } }
    @keyframes dashMoveRev { to { stroke-dashoffset: 28; } }

    /* Accent bars wave */
    .accent-bar { animation: barPulse 2.6s ease-in-out infinite; }
    @keyframes barPulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }

    /* Traffic lights &amp; toolbar */
    .tl-dot { animation: tlBreath 3s ease-in-out infinite; }
    @keyframes tlBreath {
      0%, 100% { opacity: 0.75; }
      50% { opacity: 1; }
    }
    .tool-icon { animation: toolFloat 3.6s ease-in-out infinite; }
    @keyframes toolFloat {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }

    /* Portrait shimmer &amp; scanline */
    .portrait-shimmer { animation: shimmer 4.5s ease-in-out infinite; }
    @keyframes shimmer {
      0%, 100% { opacity: 0.88; }
      50% { opacity: 1; }
    }
    .scanline { animation: scanDown 4.2s linear infinite; }
    @keyframes scanDown {
      0% { transform: translateY(-60px); }
      100% { transform: translateY(390px); }
    }

    /* Sunglasses live telemetry chart */
    .lens-chart {
      stroke-dasharray: 46;
      animation: chartDraw 2.2s linear infinite;
    }
    @keyframes chartDraw {
      0% { stroke-dashoffset: 46; opacity: 0.45; }
      50% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: -46; opacity: 0.45; }
    }
    .lens-glow { animation: lensBreath 2.8s ease-in-out infinite; }
    @keyframes lensBreath {
      0%, 100% { fill-opacity: 0.75; }
      50% { fill-opacity: 1; }
    }

    /* Hatband &amp; collar button */
    .hatband-pulse { animation: barPulse 2.4s ease-in-out infinite; }
    .collar-btn {
      transform-box: fill-box;
      transform-origin: center;
      animation: btnPulse 2s ease-in-out infinite;
    }
    @keyframes btnPulse {
      0%, 100% { transform: scale(1); opacity: 0.75; }
      50% { transform: scale(1.35); opacity: 1; }
    }

    /* Status dot radar ping */
    .status-core { animation: statusGlow 2s ease-in-out infinite; }
    @keyframes statusGlow {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; }
    }
    .status-ring {
      transform-box: fill-box;
      transform-origin: center;
      animation: radarPing 2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    @keyframes radarPing {
      0% { transform: scale(1); opacity: 0.85; }
      100% { transform: scale(3.2); opacity: 0; }
    }

    /* Cursor blink */
    .cursor-blink { animation: blink 1s steps(1, end) infinite; }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    /* Pills &amp; social icons wave */
    .pill {
      transform-box: fill-box;
      transform-origin: center;
      animation: pillWave 3.2s ease-in-out infinite;
    }
    @keyframes pillWave {
      0%, 100% { opacity: 0.78; transform: translateY(0px); }
      50% { opacity: 1; transform: translateY(-2.5px); }
    }
    .social-icon {
      transform-box: fill-box;
      transform-origin: center;
      animation: iconPulse 3s ease-in-out infinite;
    }
    @keyframes iconPulse {
      0%, 100% { opacity: 0.72; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.12); }
    }

    /* Text reveal */
    .fade-line { animation: textBreath 5s ease-in-out infinite; }
    @keyframes textBreath {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }

    /* Stagger delays */
    .d1 { animation-delay: 0.15s; }
    .d2 { animation-delay: 0.35s; }
    .d3 { animation-delay: 0.55s; }
    .d4 { animation-delay: 0.75s; }
    .d5 { animation-delay: 0.95s; }
    .d6 { animation-delay: 1.15s; }
    .d7 { animation-delay: 1.35s; }
    .d8 { animation-delay: 1.55s; }
  </style>

  
  <rect x="6" y="6" width="888" height="548" rx="18" fill="#0b101b" stroke="#c9a54c" stroke-width="1.5" />

  
  <rect class="dash-outer" x="18" y="18" width="864" height="524" rx="12" fill="none" stroke="#334155" stroke-width="1.2" stroke-dasharray="6 10" />

  
  <g filter="url(#glow-soft)">
    <rect class="accent-bar d1" x="155" y="16" width="46" height="3.5" rx="1.75" fill="#e5c063" />
    <rect class="accent-bar d2" x="306" y="16" width="46" height="3.5" rx="1.75" fill="#38bdf8" />
    <rect class="accent-bar d3" x="456" y="16" width="46" height="3.5" rx="1.75" fill="#e5c063" />
    <rect class="accent-bar d4" x="606" y="16" width="46" height="3.5" rx="1.75" fill="#38bdf8" />
    <rect class="accent-bar d5" x="752" y="16" width="46" height="3.5" rx="1.75" fill="#e5c063" />
  </g>

  
  <g filter="url(#glow-soft)">
    <rect class="accent-bar d6" x="66" y="540.5" width="38" height="3.5" rx="1.75" fill="#38bdf8" />
    <rect class="accent-bar d5" x="196" y="540.5" width="44" height="3.5" rx="1.75" fill="#e5c063" />
    <rect class="accent-bar d4" x="340" y="540.5" width="44" height="3.5" rx="1.75" fill="#38bdf8" />
    <rect class="accent-bar d3" x="484" y="540.5" width="44" height="3.5" rx="1.75" fill="#e5c063" />
    <rect class="accent-bar d2" x="628" y="540.5" width="44" height="3.5" rx="1.75" fill="#38bdf8" />
